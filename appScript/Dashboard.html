<div class="page-wrapper">
  <div class="page-header">
    <div class="title-section">
      <h2><i class="fas fa-chart-line"></i> Dashboard</h2>
      <p class="subtitle">Summary of all database sheets and record counts.</p>
    </div>
    <div class="quick-menu">
      <button class="btn-quick" onclick="loadPage('JournalEntry')"><i class="fas fa-plus"></i> New Journal</button>
      <button class="btn-quick" onclick="loadPage('SalesInvoice')"><i class="fas fa-plus"></i> Sales Invoice</button>
      <button class="btn-quick" onclick="loadPage('PurchaseInvoice')"><i class="fas fa-plus"></i> Purchase Invoice</button>

  </div>

      <div class="panel-item financial-summary">
        <h4><i class="fas fa-dollar-sign"></i> Financial Summary</h4>
        <div id="financial-summary-content">
          <p>Loading summary...</p>
        </div>
