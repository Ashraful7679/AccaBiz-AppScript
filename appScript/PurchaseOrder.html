<div class="po-wrapper">
  <div class="page-header">
    <div class="title-section">
      <h2><i class="fas fa-shopping-cart"></i> Purchase Order</h2>
      <p class="subtitle">Manage your purchase orders here.</p>
    </div>
    <button class="btn-add" onclick="openAddPurchaseOrderModal()">
      <i class="fas fa-plus-circle"></i> New Purchase Order
    </button>
  </div>

  <div class="action-bar">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="poSearch" placeholder="Search by PO number or supplier..." onkeyup="filterPurchaseOrderTable()">
    </div>
    <div class="table-info">
      <span id="rowCount">0</span> purchase orders found
    </div>
  </div>

  <div class="table-responsive">
    <table class="data-table" id="poTable">
      <thead>
        <tr>
          <th>PO Number</th>
          <th>Supplier</th>
          <th>PO Date</th>
          <th>Expected Delivery</th>
          <th>Total Amount</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="po-list-body">
        <tr>
          <td colspan="7" style="text-align:center; padding:30px; color:#95a5a6;">
            <i class="fas fa-spinner fa-spin"></i> Loading data...
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Purchase Order Modal -->
<div id="poModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">Create New Purchase Order</h3>
      <span class="close" onclick="closePoModal()">&times;</span>
    </div>

    <form id="poForm">
      <input type="hidden" id="poId">

      <div class="form-group">
        <label>Supplier *</label>
        <select id="supplierId" required>
          <option value="">-- Select Supplier --</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>PO Date *</label>
          <input type="date" id="poDate" required>
        </div>
        <div class="form-group">
          <label>Expected Delivery Date *</label>
          <input type="date" id="expectedDeliveryDate" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Expected Final Receiving Date *</label>
          <input type="date" id="expectedFinalReceivingDate" required>
        </div>
        <div class="form-group">
          <label>Currency *</label>
          <select id="currency" required>
            <option value="BDT">BDT</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Status</label>
          <select id="status">
            <option value="Pending">Pending</option>
            <option value="Approved">Approved</option>
            <option value="Rejected">Rejected</option>
          </select>
        </div>
      </div>

      <!-- Line Items Section -->
      <div class="form-section">
        <h4>Purchase Order Line Items</h4>

        <div class="form-row">
          <div class="form-group">
            <label>Product *</label>
            <select id="productSelect" onchange="updateProductPrice()">
              <option value="">-- Select Product --</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Unit Price</label>
            <input type="number" id="unitPrice" step="0.01" placeholder="Auto-populated from product">
          </div>
          <div class="form-group">
            <label>Quantity *</label>
            <input type="number" id="productQty" step="0.01" required placeholder="Enter quantity">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Tax %</label>
            <input type="number" id="taxPercent" step="0.01" value="0" placeholder="Enter tax percentage">
          </div>
          <div class="form-group">
            <label>Expected Receiving Date</label>
            <input type="date" id="expectedReceiptDate">
          </div>
        </div>

        <button type="button" class="btn-primary" id="addLineItemBtn" onclick="addLineItem()" style="width: 100%; margin-top: 10px;">
          <i class="fas fa-plus"></i> Add Line Item
        </button>

        <!-- Line Items Container -->
        <div class="line-items" id="lineItemsContainer">
          <!-- Line items will be added here -->
        </div>

        <!-- PO Summary -->
        <div id="poSummary">
          <div class="summary-box">
            <div class="summary-row">
              <span>Subtotal:</span>
              <span>0.00</span>
            </div>
            <div class="summary-row total">
              <span>Grand Total:</span>
              <span>0.00</span>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" onclick="closePoModal()" id="cancelPoBtn">Cancel</button>
        <button type="submit" class="btn-primary" id="savePoBtn">Save Purchase Order</button>
      </div>
    </form>
  </div>
</div>

<script>
  // Initialize the page
  setTimeout(function() {
    loadSheetForPage('PurchaseOrder');
  }, 100);
</script>
