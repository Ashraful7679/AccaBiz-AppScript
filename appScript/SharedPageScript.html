<script>
  const pageSheetMap = {
    Dashboard: ['dashboard', 'summary'],
    Product: ['product'],
    Supplier: ['vendor', 'supplier'],
    Customer: ['customer'],
    PurchaseOrder: ['purchaseorder', 'purchase order', 'po'],
    PurchaseInvoice: ['purchaseinvoice', 'purchase invoice'],
    ImportPI: ['importpi', 'import pi'],
    ProformaInvoice: ['proformainvoice', 'proforma invoice'],
    SalesInvoice: ['salesinvoice', 'sales invoice'],
    Payment: ['payments', 'payment', 'payment_receive', 'payment receive'],
    LCManagement: ['lc', 'lcmanagement'],
    ChartOfAccount: ['chartofaccount', 'chart of account'],
    JournalEntry: ['journalentry', 'journal entry'],
    Employee: ['employee', 'employees'],
    BankReconciliation: ['bankreconciliation', 'bank reconciliation'],
    Reports: ['reports', 'report'],
    Backup: ['backup']
  };

  function normalizeText(value) {
    return value ? value.toString().trim().toLowerCase() : '';
  }

  function findSheetForPage(pageName, sheetNames) {
    const aliases = pageSheetMap[pageName] || [];
    for (let alias of aliases) {
      const normalizedAlias = normalizeText(alias);
      const match = sheetNames.find(name => normalizeText(name) === normalizedAlias || normalizeText(name).includes(normalizedAlias));
      if (match) return match;
    }
    return null;
  }

  function loadSheetForPage(pageName) {
    const container = document.getElementById('page-data-container');
    if (!container) return;
    container.innerHTML = '<div class="placeholder-box">Loading sheet data...</div>';

    google.script.run
      .withSuccessHandler(function(sheetNames) {
        const sheetName = findSheetForPage(pageName, sheetNames);
        if (!sheetName) {
          renderSheetPlaceholder(container, pageName, sheetNames);
          return;
        }

        if (pageName === 'Dashboard') {
          loadDashboardSummary(sheetNames);
          return;
        }

        google.script.run
          .withSuccessHandler(function(rows) {
            if (!rows || rows.length === 0) {
              container.innerHTML = '<div class="placeholder-box">No data found in sheet "' + sheetName + '".</div>';
              return;
            }
            renderSheetTable(container, rows, sheetName);
          })
          .withFailureHandler(function(err) {
            container.innerHTML = '<div class="placeholder-box">Unable to load sheet data: ' + err + '</div>';
          })
          .getSheetData(sheetName);
      })
      .withFailureHandler(function(err) {
        container.innerHTML = '<div class="placeholder-box">Unable to load sheet list: ' + err + '</div>';
      })
      .getAllSheetNames();
  }

  function renderSheetPlaceholder(container, pageName, sheetNames) {
    const list = sheetNames.length ? sheetNames.map(name => '<li>' + name + '</li>').join('') : '<li>No sheets found</li>';
    container.innerHTML = `
      <div class="page-content">
        <div class="placeholder-box">
          <div>
            <strong>No linked sheet found for page "${pageName}".</strong>
            <p>Available sheet names:</p>
            <ul style="padding-left: 20px; margin: 10px 0;">${list}</ul>
          </div>
        </div>
      </div>`;
  }

  function renderSheetTable(container, rows, sheetName) {
    const headers = Object.keys(rows[0] || {});
    const head = headers.map(h => '<th>' + h + '</th>').join('');
    const totalRows = rows.length;
    const rowsPerPage = 15;
    const totalPages = Math.ceil(totalRows / rowsPerPage);
    let currentPage = 1;

    function renderPage(page) {
      const start = (page - 1) * rowsPerPage;
      const end = start + rowsPerPage;
      const pageRows = rows.slice(start, end);
      const body = pageRows.map(row => {
        const cells = headers.map(header => '<td>' + (row[header] || '') + '</td>').join('');
        return '<tr>' + cells + '</tr>';
      }).join('');

      const pagination = totalPages > 1 ? `
        <div class="pagination">
          <button id="prev-btn" ${page === 1 ? 'disabled' : ''}>Previous</button>
          <span>Page ${page} of ${totalPages}</span>
          <button id="next-btn" ${page === totalPages ? 'disabled' : ''}>Next</button>
        </div>` : '';

      container.innerHTML = `
        <div class="page-content">
          <h3 style="margin-top:0;">Sheet: ${sheetName}</h3>
          <div class="table-responsive">
            <table class="data-table"> 
              <thead><tr>${head}</tr></thead>
              <tbody>${body}</tbody>
            </table>
          </div>
          ${pagination}
        </div>`;

      // Add event listeners for pagination
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      if (prevBtn) prevBtn.onclick = () => renderPage(page - 1);
      if (nextBtn) nextBtn.onclick = () => renderPage(page + 1);
    }

    renderPage(currentPage);
  }

  function loadDashboardData() {
    const container = document.getElementById('data-table-container');
    if (!container) return;
    container.innerHTML = '<div class="placeholder-box">Loading dashboard data...</div>';

    google.script.run
      .withSuccessHandler(function(sheetNames) {
        // Load data from all sheets
        const promises = sheetNames.map(sheet => {
          return new Promise((resolve) => {
            google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(() => resolve([]))
              .getSheetData(sheet);
          });
        });

        Promise.all(promises).then(allData => {
          const combinedData = [];
          allData.forEach((rows, index) => {
            const sheetName = sheetNames[index];
            rows.forEach(row => {
              combinedData.push({ ...row, Sheet: sheetName });
            });
          });

          if (combinedData.length === 0) {
            container.innerHTML = '<div class="placeholder-box">No data found in any sheets.</div>';
            return;
          }

          renderCombinedTable(container, combinedData);
        });
      })
      .withFailureHandler(function(err) {
        container.innerHTML = '<div class="placeholder-box">Unable to load sheet list: ' + err + '</div>';
      })
      .getAllSheetNames();

    // Load other sections
    loadActivities();
    loadFinancialChart();
    loadFinancialSummary();
  }

  function renderCombinedTable(container, rows) {
    const headers = ['Sheet', ...Object.keys(rows[0] || {}).filter(h => h !== 'Sheet')];
    const head = headers.map(h => '<th>' + h + '</th>').join('');
    const totalRows = rows.length;
    const rowsPerPage = 15;
    const totalPages = Math.ceil(totalRows / rowsPerPage);
    let currentPage = 1;

    function renderPage(page) {
      const start = (page - 1) * rowsPerPage;
      const end = start + rowsPerPage;
      const pageRows = rows.slice(start, end);
      const body = pageRows.map(row => {
        const cells = headers.map(header => '<td>' + (row[header] || '') + '</td>').join('');
        return '<tr>' + cells + '</tr>';
      }).join('');

      const pagination = totalPages > 1 ? `
        <div class="pagination">
          <button id="prev-btn" ${page === 1 ? 'disabled' : ''}>Previous</button>
          <button id="next-btn" ${page === totalPages ? 'disabled' : ''}>Next</button>
        </div>` : '';

      container.innerHTML = `
        <div class="page-content">
          <h3 style="margin-top:0;">All Data Overview</h3>
          <div class="table-responsive">
            <table class="data-table"> 
              <thead><tr>${head}</tr></thead>
              <tbody>${body}</tbody>
            </table>
          </div>
          ${pagination}
        </div>`;

      // Add event listeners for pagination
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      if (prevBtn) prevBtn.onclick = () => renderPage(page - 1);
      if (nextBtn) nextBtn.onclick = () => renderPage(page + 1);
    }

    renderPage(currentPage);
  }

  function loadActivities() {
    const activityList = document.getElementById('activity-list');
    if (!activityList) return;
    // Simulate loading recent activities
    activityList.innerHTML = `
      <ul>
        <li>New product added: Laptop</li>
        <li>Sales invoice created: INV-001</li>
        <li>Payment received: $500</li>
        <li>Journal entry: Office supplies</li>
      </ul>`;
  }

  function loadFinancialChart() {
    const ctx = document.getElementById('financialChart');
    if (!ctx) return;
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May'],
        datasets: [{
          label: 'Revenue',
          data: [12000, 19000, 3000, 5000, 2000],
          backgroundColor: 'rgba(54, 162, 235, 0.2)',
          borderColor: 'rgba(54, 162, 235, 1)',
          borderWidth: 1
        }]
      },
      options: {
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
  }

  function loadFinancialSummary() {
    const summaryContent = document.getElementById('financial-summary-content');
    if (!summaryContent) return;
    summaryContent.innerHTML = `
      <p><strong>Total Revenue:</strong> $50,000</p>
      <p><strong>Total Expenses:</strong> $30,000</p>
      <p><strong>Net Profit:</strong> $20,000</p>
      <p><strong>Outstanding Invoices:</strong> $5,000</p>`;
  }
</script>
