<style>
  .supplier-wrapper { animation: fadeIn 0.5s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
  .title-section h2 { margin: 0; color: #2c3e50; font-size: 1.5rem; }
  .subtitle { margin: 5px 0 0; color: #7f8c8d; font-size: 0.9rem; }

  .btn-add { background: #27ae60; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
  .btn-add:hover { background: #219150; box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3); }

  .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .search-box { position: relative; width: 350px; }
  .search-box i { position: absolute; left: 12px; top: 12px; color: #bdc3c7; }
  .search-box input { width: 100%; padding: 10px 10px 10px 40px; border: 1px solid #dcdde1; border-radius: 6px; outline: none; transition: 0.3s; }
  .search-box input:focus { border-color: #3498db; box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1); }

  .table-responsive { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-x: auto; }
  .data-table { width: 100%; border-collapse: collapse; min-width: 1200px; }
  .data-table th { background: #f8f9fa; padding: 15px; text-align: left; font-weight: 600; color: #34495e; border-bottom: 2px solid #edf2f7; }
  .data-table td { padding: 15px; border-bottom: 1px solid #edf2f7; color: #2d3436; font-size: 0.95rem; }

  .status-pill { padding: 4px 12px; border-radius: 50px; font-size: 0.8rem; font-weight: bold; }
  .active-status { background: #d4edda; color: #155724; }
  .inactive-status { background: #f8d7da; color: #721c24; }

  .edit-icon { color: #3498db; cursor: pointer; transition: 0.2s; padding: 5px; }
  .edit-icon:hover { color: #2980b9; transform: scale(1.2); }
  .data-table td { vertical-align: middle; }

  .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); overflow-y: auto; align-items: flex-start; justify-content: center; padding: 20px 10px; box-sizing: border-box; }
  .modal-content { background: white; margin: 20px auto; padding: 0; border-radius: 8px; width: 600px; max-width: 100%; max-height: calc(100vh - 40px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); animation: slideDown 0.3s; overflow: hidden; display: flex; flex-direction: column; }

  @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal-header { padding: 15px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
  .close { font-size: 24px; cursor: pointer; color: #888; }
  .close:hover { color: #333; }

  .form-group { padding: 10px 20px; display: flex; flex-direction: column; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 10px; }

  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #3498db; box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2); }

  .modal-footer { padding: 15px 20px; border-top: 1px solid #eee; text-align: right; display: flex; justify-content: flex-end; gap: 10px; }
  .btn-cancel { background: #95a5a6; color: white; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; }
  .btn-save { background: #27ae60; color: white; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; }
  .btn-save:hover { background: #219150; }
</style>
