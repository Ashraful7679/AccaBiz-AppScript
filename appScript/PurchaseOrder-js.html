<script>
  let allPurchaseOrders = [];
  let currentPOLineItems = [];
  let suppliers = [];
  let products = [];

  document.addEventListener('DOMContentLoaded', function() {
    console.log("Purchase Order page ready");
    fetchPurchaseOrders();
    loadSuppliers();
    loadProducts();
  });

  setTimeout(function() {
    if (typeof fetchPurchaseOrders === 'function') {
      fetchPurchaseOrders();
      loadSuppliers();
      loadProducts();
    }
  }, 500);

  function fetchPurchaseOrders() {
    google.script.run
      .withSuccessHandler(function(data) {
        allPurchaseOrders = data;
        renderPurchaseOrderTable(data);
      })
      .withFailureHandler(function(err) {
        console.error("Error fetching POs:", err);
        showNotification("Error loading purchase orders: " + err, 'error');
      })
      .getPurchaseOrderData();
  }

  function loadSuppliers() {
    google.script.run
      .withSuccessHandler(function(data) {
        suppliers = data || [];
        populateSupplierDropdown();
      })
      .withFailureHandler(function(err) {
        console.error("Error loading suppliers:", err);
        showNotification("Error loading suppliers: " + err, 'error');
      })
      .getSupplierData();
  }

  function loadProducts() {
    google.script.run
      .withSuccessHandler(function(data) {
        products = data || [];
        populateProductDropdown();
      })
      .withFailureHandler(function(err) {
        console.error("Error loading products:", err);
      })
      .getProductData();
  }

  function populateSupplierDropdown() {
    const select = document.getElementById('supplierSelect');
    if (!select) return;
    select.innerHTML = '<option value="">-- Select Supplier --</option>';
    suppliers.forEach(supplier => {
      const option = document.createElement('option');
      option.value = supplier.id || '';
      option.textContent = supplier.name || 'Unknown';
      select.appendChild(option);
    });
  }

  function populateProductDropdown() {
    const select = document.getElementById('productSelect');
    if (!select) return;
    select.innerHTML = '<option value="">-- Select Product --</option>';
    products.forEach(product => {
      const option = document.createElement('option');
      option.value = product.id || '';
      option.textContent = (product.name || 'Unknown') + ' (' + (product.sku || 'N/A') + ')';
      select.appendChild(option);
    });
  }

  function renderPurchaseOrderTable(data) {
    const tbody = document.getElementById('po-list-body');
    const rowCount = document.getElementById('rowCount');

    if (!data || data.length === 0) {
      if (tbody) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:30px; color:#95a5a6;">No purchase orders found.</td></tr>';
      }
      if (rowCount) rowCount.innerText = '0';
      return;
    }

    if (rowCount) rowCount.innerText = data.length;
    if (tbody) tbody.innerHTML = '';

    data.forEach(po => {
      const status = po.status || 'Pending';
      const statusClass = status.toLowerCase() === 'approved' ? 'status-approved' : 
                         status.toLowerCase() === 'rejected' ? 'status-rejected' : 'status-pending';

      const supplierName = suppliers.find(s => s.id === po.supplierId)?.name || (po.supplierId || 'N/A');

      const row = `
        <tr>
          <td>${po.poNumber || 'N/A'}</td>
          <td>${supplierName}</td>
          <td>${po.poDate || 'N/A'}</td>
          <td>${po.expectedFinalReceivingDate || 'N/A'}</td>
          <td>${po.currency || 'BDT'} ${po.totalAmount || '0'}</td>
          <td>
            <select onchange="updatePOStatus('${po.id}', this.value)" style="padding: 4px; border-radius: 4px; border: none; cursor: pointer;">
              <option value="Pending" ${status === 'Pending' ? 'selected' : ''}>Pending</option>
              <option value="Approved" ${status === 'Approved' ? 'selected' : ''}>Approved</option>
              <option value="Rejected" ${status === 'Rejected' ? 'selected' : ''}>Rejected</option>
            </select>
          </td>
          <td style="text-align: center;">
            <div class="action-buttons">
              <button class="btn-action btn-view" onclick="viewPurchaseOrder('${po.id}')" title="View Details">
                <i class="fas fa-eye"></i>
              </button>
              <button class="btn-action btn-edit" onclick="editPurchaseOrder('${po.id}')" title="Edit">
                <i class="fas fa-edit"></i>
              </button>
              <button class="btn-action" style="color: #27ae60;" onclick="printPurchaseOrder('${po.id}')" title="Print">
                <i class="fas fa-print"></i>
              </button>
              <button class="btn-action btn-delete" onclick="deletePurchaseOrder('${po.id}')" title="Delete">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      `;

      if (tbody) tbody.insertAdjacentHTML('beforeend', row);
    });
  }

  function openAddPurchaseOrderModal() {
    currentPOLineItems = [];
    document.getElementById('modalTitle').innerText = "Create New Purchase Order";
    document.getElementById('poForm').reset();
    document.getElementById('poId').value = "";
    document.getElementById('lineItemsContainer').innerHTML = '';
    updatePOSummary();
    document.getElementById('poModal').style.display = "flex";
  }

  function viewPurchaseOrder(poId) {
    const po = allPurchaseOrders.find(p => p.id === poId);
    if (!po) {
      showNotification('Purchase Order not found', 'error');
      return;
    }
    console.log("Viewing PO:", po);
    google.script.run
      .withSuccessHandler(function(lines) {
        console.log("PO lines received:", lines);
        currentPOLineItems = lines || [];
        loadPOForEditing(po, true);
      })
      .withFailureHandler(function(err) {
        console.error("Error loading PO details:", err);
        showNotification('Error loading PO details: ' + err, 'error');
      })
      .getPurchaseOrderLinesByPO(poId);
  }

  function editPurchaseOrder(poId) {
    const po = allPurchaseOrders.find(p => p.id === poId);
    if (!po) {
      showNotification('Purchase Order not found', 'error');
      return;
    }
    console.log("Editing PO:", po);
    google.script.run
      .withSuccessHandler(function(lines) {
        console.log("PO lines received:", lines);
        currentPOLineItems = lines || [];
        loadPOForEditing(po, false);
      })
      .withFailureHandler(function(err) {
        console.error("Error loading PO details:", err);
        showNotification('Error loading PO details: ' + err, 'error');
      })
      .getPurchaseOrderLinesByPO(poId);
  }

  function loadPOForEditing(po, viewOnly) {
    document.getElementById('modalTitle').innerText = viewOnly ? "View Purchase Order" : "Edit Purchase Order";
    document.getElementById('poId').value = po.id;
    document.getElementById('supplierId').value = po.supplierId || '';
    document.getElementById('poDate').value = po.poDate || '';
    document.getElementById('expectedFinalReceivingDate').value = po.expectedFinalReceivingDate || '';
    document.getElementById('currency').value = po.currency || 'BDT';
    document.getElementById('status').value = po.status || 'Pending';
    
    // Populate line items
    const container = document.getElementById('lineItemsContainer');
    container.innerHTML = '';
    currentPOLineItems.forEach(line => {
      const product = products.find(p => p.id === line.productId);
      addLineItemDisplay(line, product);
    });

    updatePOSummary();

    if (viewOnly) {
      document.querySelectorAll('#poForm input, #poForm select, #poForm textarea').forEach(el => el.disabled = true);
      document.getElementById('addLineItemBtn').style.display = 'none';
      document.getElementById('savePoBtn').style.display = 'none';
      document.getElementById('cancelPoBtn').textContent = 'Close';
    } else {
      document.querySelectorAll('#poForm input, #poForm select, #poForm textarea').forEach(el => el.disabled = false);
      document.getElementById('addLineItemBtn').style.display = 'inline-block';
      document.getElementById('savePoBtn').style.display = 'inline-block';
      document.getElementById('cancelPoBtn').textContent = 'Cancel';
    }

    document.getElementById('poModal').style.display = "flex";
  }

  function addLineItem() {
    const productId = document.getElementById('productSelect').value;
    const productQty = document.getElementById('productQty').value;
    const taxPercent = document.getElementById('taxPercent').value || 0;
    const expectedReceipt = document.getElementById('expectedReceiptDate').value;

    if (!productId) {
      showNotification('Please select a product', 'warning');
      return;
    }
    if (!productQty || productQty <= 0) {
      showNotification('Please enter quantity', 'warning');
      return;
    }

    const product = products.find(p => p.id === productId);
    if (!product) {
      showNotification('Product not found', 'error');
      return;
    }

    const unitPrice = parseFloat(document.getElementById('unitPrice').value) || parseFloat(product.unitPrice) || 0;
    const quantity = parseFloat(productQty);
    const tax = parseFloat(taxPercent);
    const subtotal = unitPrice * quantity;
    const taxAmount = (subtotal * tax) / 100;
    const total = subtotal + taxAmount;

    const lineItem = {
      id: 'line-' + Date.now(),
      productId: productId,
      itemDescription: product.name || '',
      quantity: quantity,
      currency: product.currency || 'BDT',
      unitPrice: unitPrice,
      taxPercent: tax,
      total: total,
      expectedReceivingDate: expectedReceipt,
      isNew: true
    };

    currentPOLineItems.push(lineItem);
    addLineItemDisplay(lineItem, product);
    
    // Reset form
    document.getElementById('productSelect').value = '';
    document.getElementById('productQty').value = '';
    document.getElementById('unitPrice').value = '';
    document.getElementById('taxPercent').value = '0';
    document.getElementById('expectedReceiptDate').value = '';
    
    updatePOSummary();
    showNotification('Line item added', 'success');
  }

  function addLineItemDisplay(lineItem, product) {
    const container = document.getElementById('lineItemsContainer');
    const html = `
      <div class="line-item" id="line-${lineItem.id}">
        <div class="line-item-info">
          <span><strong>${lineItem.itemDescription}</strong></span>
          <span>${lineItem.quantity} x ${lineItem.currency} ${lineItem.unitPrice} (Tax: ${lineItem.taxPercent}%)</span>
          <span>Expected: ${lineItem.expectedReceivingDate || 'N/A'}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <span class="line-item-amount">${lineItem.currency} ${lineItem.total.toFixed(2)}</span>
          <button type="button" class="btn-action btn-delete" onclick="removeLineItem('${lineItem.id}')" title="Delete">
            <i class="fas fa-trash-alt"></i>
          </button>
        </div>
      </div>
    `;
    container.insertAdjacentHTML('beforeend', html);
  }

  function removeLineItem(lineId) {
    currentPOLineItems = currentPOLineItems.filter(item => item.id !== lineId);
    const element = document.getElementById('line-' + lineId);
    if (element) element.remove();
    updatePOSummary();
  }

  function updateProductPrice() {
    const productId = document.getElementById('productSelect').value;
    const product = products.find(p => p.id === productId);
    if (product) {
      document.getElementById('unitPrice').value = product.unitPrice || '';
      document.getElementById('currency').value = product.currency || 'BDT';
    }
  }

  function updatePOSummary() {
    let subtotal = 0;
    let totalTax = 0;

    currentPOLineItems.forEach(item => {
      const itemSub = item.unitPrice * item.quantity;
      subtotal += itemSub;
      totalTax += (itemSub * item.taxPercent) / 100;
    });

    const grandTotal = subtotal + totalTax;

    const summary = document.getElementById('poSummary');
    if (summary) {
      summary.innerHTML = `
        <div class="summary-box">
          <div class="summary-row">
            <span>Subtotal:</span>
            <span>${document.getElementById('currency').value || 'BDT'} ${subtotal.toFixed(2)}</span>
          </div>
          <div class="summary-row">
            <span>Tax (Total):</span>
            <span>${document.getElementById('currency').value || 'BDT'} ${totalTax.toFixed(2)}</span>
          </div>
          <div class="summary-row total">
            <span>Grand Total:</span>
            <span>${document.getElementById('currency').value || 'BDT'} ${grandTotal.toFixed(2)}</span>
          </div>
        </div>
      `;
    }
  }

  function closePoModal() {
    document.getElementById('poModal').style.display = "none";
  }

  document.getElementById('poForm').onsubmit = function(e) {
    e.preventDefault();

    if (currentPOLineItems.length === 0) {
      showNotification('Please add at least one line item', 'warning');
      return;
    }

    const saveBtn = document.getElementById('savePoBtn');
    saveBtn.disabled = true;
    saveBtn.innerText = "Saving...";

    let subtotal = 0;
    let totalTax = 0;
    currentPOLineItems.forEach(item => {
      const itemSub = item.unitPrice * item.quantity;
      subtotal += itemSub;
      totalTax += (itemSub * item.taxPercent) / 100;
    });

    const formData = {
      id: document.getElementById('poId').value,
      supplierId: document.getElementById('supplierId').value,
      poDate: document.getElementById('poDate').value,
      expectedFinalReceivingDate: document.getElementById('expectedFinalReceivingDate').value,
      currency: document.getElementById('currency').value,
      totalAmount: subtotal + totalTax,
      status: document.getElementById('status').value,
      lineItems: currentPOLineItems
    };

    google.script.run
      .withSuccessHandler(function(response) {
        showNotification('Purchase Order saved successfully!', 'success');
        closePoModal();
        fetchPurchaseOrders();
        saveBtn.disabled = false;
        saveBtn.innerText = "Save Purchase Order";
      })
      .withFailureHandler(function(err) {
        showNotification('Error: ' + err, 'error');
        saveBtn.disabled = false;
        saveBtn.innerText = "Save Purchase Order";
      })
      .savePurchaseOrder(formData);
  };

  function deletePurchaseOrder(poId) {
    if (!confirm('Are you sure you want to delete this purchase order?')) return;

    google.script.run
      .withSuccessHandler(function(response) {
        showNotification('Purchase Order deleted successfully!', 'success');
        fetchPurchaseOrders();
      })
      .withFailureHandler(function(err) {
        showNotification('Error deleting PO: ' + err, 'error');
      })
      .deletePurchaseOrder(poId);
  }

  function updatePOStatus(poId, newStatus) {
    const po = allPurchaseOrders.find(p => p.id === poId);
    if (!po) {
      showNotification('Purchase Order not found', 'error');
      return;
    }

    google.script.run
      .withSuccessHandler(function(response) {
        showNotification('Purchase Order status updated to: ' + newStatus, 'success');
        po.status = newStatus;
        fetchPurchaseOrders();
      })
      .withFailureHandler(function(err) {
        showNotification('Error updating status: ' + err, 'error');
        fetchPurchaseOrders();
      })
      .updatePurchaseOrderStatus(poId, newStatus);
  }

  function printPurchaseOrder(poId) {
    const po = allPurchaseOrders.find(p => p.id === poId);
    if (!po) {
      showNotification('Purchase Order not found', 'error');
      return;
    }

    google.script.run
      .withSuccessHandler(function(lines) {
        const supplier = suppliers.find(s => s.id === po.supplierId) || {};
        let html = `
          <html>
            <head>
              <title>Purchase Order - ${po.poNumber}</title>
              <style>
                body { font-family: Arial, sans-serif; margin: 20px; }
                .header { text-align: center; margin-bottom: 30px; }
                .header h2 { margin: 0; }
                .po-info { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
                .info-box { border: 1px solid #ddd; padding: 10px; }
                .info-box strong { display: block; color: #2c3e50; }
                table { width: 100%; border-collapse: collapse; margin: 20px 0; }
                th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
                th { background: #f8f9fa; font-weight: bold; }
                .total { text-align: right; font-weight: bold; }
              </style>
            </head>
            <body>
              <div class="header">
                <h2>Purchase Order</h2>
                <p>${po.poNumber}</p>
              </div>
              <div class="po-info">
                <div class="info-box">
                  <strong>PO Date:</strong> ${po.poDate}
                </div>
                <div class="info-box">
                  <strong>Expected Receipt:</strong> ${po.expectedFinalReceivingDate}
                </div>
                <div class="info-box">
                  <strong>Supplier:</strong> ${supplier.name || 'N/A'}
                </div>
                <div class="info-box">
                  <strong>Status:</strong> ${po.status}
                </div>
              </div>
              <table>
                <thead>
                  <tr>
                    <th>Item Description</th>
                    <th>Quantity</th>
                    <th>Unit Price</th>
                    <th>Total</th>
                  </tr>
                </thead>
                <tbody>
        `;
        
        (lines || []).forEach(line => {
          html += `
                  <tr>
                    <td>${line.itemDescription}</td>
                    <td>${line.quantity}</td>
                    <td>${line.currency} ${line.unitPrice}</td>
                    <td>${line.currency} ${line.total}</td>
                  </tr>
          `;
        });
        
        html += `
                </tbody>
              </table>
              <div class="total">Grand Total: ${po.currency} ${po.totalAmount}</div>
              <script>window.print();<\/script>
            </body>
          </html>
        `;
        
        const printWindow = window.open('', '', 'height=600,width=800');
        printWindow.document.write(html);
        printWindow.document.close();
      })
      .withFailureHandler(function(err) {
        showNotification('Error generating print: ' + err, 'error');
      })
      .getPurchaseOrderLinesByPO(poId);
  }

  function filterPurchaseOrderTable() {
    const input = document.getElementById("poSearch").value.toUpperCase();
    const rows = document.querySelectorAll("#poTable tbody tr");
    rows.forEach(row => {
      row.style.display = row.textContent.toUpperCase().includes(input) ? "" : "none";
    });
  }
</script>
